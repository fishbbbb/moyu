appId: com.moyu.reader
productName: 墨鱼阅读器
copyright: Copyright © zhouxinyu
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - assets/**/*
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
  - '**/better-sqlite3/**'
npmRebuild: true
mac:
  category: public.app-category.entertainment
  target:
    - dmg
    - zip
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: false
win:
  target:
    - zip
    - portable
  icon: build/icon.png
linux:
  target: []
electronLanguages:
  - zh-CN
  - en-US
